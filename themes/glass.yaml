---
"Glass Blue":
  # Journal
  state-icon-color: "rgb(var(--color-theme))"
  border-radius: "25px"
  ha-card-border-radius: "var(--border-radius)"
  error-color: "var(--google-red)"
  warning-color: "var(--google-yellow)"
  success-color: "var(--google-green)"
  info-color: "var(--google-blue)"
  divider-color: "rgba(var(--color-theme),.12)"
  accent-color: "var(--google-yellow)"
  ha-dialog-border-radius: "28px"
  # fix added border-lines in 2022.11
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(255,255,255,0.07)"
  ha-card-background: "linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01))"
  ha-card-box-shadow: "0 8px 30px rgba(0,0,0,0.45)"
  ha-card-backdrop-filter: "none"
  lovelace-background: "radial-gradient(1200px 600px at 10% -10%, rgba(64,120,255,0.22), transparent 60%), radial-gradient(900px 600px at 100% 0%, rgba(180,70,255,0.18), transparent 55%), radial-gradient(900px 700px at 50% 110%, rgba(0,200,170,0.14), transparent 60%), #0b0f17"
  ha-dialog-surface-background: "rgba(18,24,38,1)"
  # Dim and blur the page behind dialogs
  mdc-dialog-scrim-color: "rgba(0,0,0,0.5)"
  ha-dialog-scrim-backdrop-filter: "blur(10px)"
  sidebar-background-color: "rgba(11,15,23,0.6)"
  sidebar-menu-button-background-color: transparent
  sidebar-icon-color: "#9aa6bd"
  sidebar-text-color: "#9aa6bd"
  sidebar-selected-background-color: "rgba(137,179,248,0.14)"
  sidebar-divider-color: "rgba(255,255,255,0.06)"
  # Edit-mode header and tab bar (hui-root uses the *-edit-* variables, default #455a64 / white)
  app-header-edit-background-color: "color-mix(in srgb, var(--primary-color) 16%, rgba(11,15,23,0.88))"
  app-header-edit-text-color: "var(--primary-text-color)"
  app-header-backdrop-filter: "blur(18px) saturate(140%)"
  app-header-border-bottom: "1px solid rgba(255,255,255,0.07)"
  app-header-selection-bar-color: "var(--primary-color)"
  # # Fonts
  primary-font-family: "Ubuntu, sans-serif"
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-common-code_-_font-family: "var(--primary-font-family)"
  paper-font-body1_-_font-family: "var(--primary-font-family)"
  paper-font-subhead_-_font-family: "var(--primary-font-family)"
  paper-font-headline_-_font-family: "var(--primary-font-family)"
  paper-font-caption_-_font-family: "var(--primary-font-family)"
  paper-font-title_-_font-family: "var(--primary-font-family)"
  ha-card-header-font-family: "var(--primary-font-family)"
  ha-font-family-heading: "var(--primary-font-family)"
  ha-font-family-body: "var(--primary-font-family)"
  ha-font-family-code: "var(--primary-font-family)"
  ha-font-family-longform: "var(--primary-font-family)"
  md-list-item-label-text-font: "var(--primary-font-family)"
  mdc-typography-font-family: "var(--primary-font-family)"
  mdc-typography-body2-font-family: "var(--primary-font-family)"

  # Mushroom chips (bigger, softer)
  chip-height: 34px
  chip-font-size: 13px
  chip-icon-size: 20px
  chip-border-radius: 17px
  chip-box-shadow: none
  chip-border-width: 0px
  chip-spacing: 8px
  # Bar-card severity colours (softer)
  bar-low-color: "#3FA66B"
  bar-mid-color: "#E08A2E"
  bar-high-color: "#D9534F"

  # Buttons: primary (loud) is now solid so "Add integration" and dialog
  # actions are readable; secondary (normal) stays soft glass
  wa-color-brand-fill-loud: "#89B3F8"
  wa-color-brand-on-loud: "#0b0f17"
  wa-color-brand-border-loud: "#89B3F8"
  wa-color-brand-fill-normal: "rgba(137,179,248,0.12)"
  wa-color-brand-on-normal: "#d0e1fc"
  wa-color-brand-border-normal: "rgba(137,179,248,0.35)"
  wa-color-neutral-fill-normal: "rgba(255,255,255,0.05)"
  wa-color-neutral-border-normal: "rgba(255,255,255,0.12)"
  wa-form-control-border-width: 1px
  ha-color-fill-primary-loud-resting: "var(--primary-color)"
  ha-color-fill-primary-loud-hover: "color-mix(in srgb, var(--primary-color) 82%, white)"
  ha-color-fill-primary-loud-active: "color-mix(in srgb, var(--primary-color) 78%, black)"
  ha-color-on-primary-loud: "var(--primary-background-color)"
  # Input boxes and pickers
  ha-color-form-background: "rgba(255,255,255,0.05)"
  ha-border-radius-sm: 14px
  ha-color-border-neutral-loud: "rgba(137,179,248,0.45)"
  input-fill-color: "rgba(255,255,255,0.05)"
  input-idle-line-color: "rgba(255,255,255,0.12)"
  input-hover-line-color: "rgba(137,179,248,0.6)"
  mdc-text-field-fill-color: "rgba(255,255,255,0.05)"
  mdc-shape-small: 14px

  # Search bars and inputs (ha-input / ha-input-search)
  ha-color-form-background-hover: "rgba(255,255,255,0.09)"
  ha-color-form-background-disabled: "rgba(255,255,255,0.025)"
  ha-color-border-neutral-quiet: "rgba(255,255,255,0.14)"
  ha-color-border-neutral-normal: "rgba(255,255,255,0.28)"
  ha-color-text-secondary: "#9aa6bd"
  ha-color-focus: "rgba(var(--color-blue),0.6)"

  # Hover and fill states (integration cards, chips, selected menu items)
  ha-color-fill-neutral-quiet-resting: "rgba(var(--color-blue),0.08)"
  ha-color-fill-neutral-quiet-hover: "rgba(var(--color-blue),0.14)"
  ha-color-fill-neutral-quiet-active: "rgba(var(--color-blue),0.06)"
  ha-color-fill-neutral-normal-resting: "rgba(255,255,255,0.06)"
  ha-color-fill-neutral-normal-hover: "rgba(255,255,255,0.10)"
  ha-color-fill-neutral-normal-active: "rgba(255,255,255,0.06)"
  ha-color-fill-primary-quiet-resting: "rgba(var(--color-blue),0.08)"
  ha-color-fill-primary-quiet-hover: "rgba(var(--color-blue),0.14)"
  ha-color-fill-primary-quiet-active: "rgba(var(--color-blue),0.08)"
  ha-color-fill-primary-normal-resting: "rgba(var(--color-blue),0.16)"
  ha-color-fill-primary-normal-hover: "rgba(var(--color-blue),0.24)"
  ha-color-fill-primary-normal-active: "rgba(var(--color-blue),0.16)"

  # Toggle switches
  ha-switch-background-color: "rgba(255,255,255,0.08)"
  ha-switch-background-color-hover: "rgba(255,255,255,0.14)"
  ha-switch-border-color: "rgba(255,255,255,0.22)"
  ha-switch-thumb-background-color: "#9aa6bd"
  ha-switch-thumb-border-color: "#9aa6bd"
  ha-switch-checked-background-color: "rgba(var(--color-blue),0.35)"
  ha-switch-checked-background-color-hover: "rgba(var(--color-blue),0.5)"
  ha-switch-checked-border-color: "var(--primary-color)"
  ha-switch-checked-thumb-background-color: "var(--primary-color)"
  ha-switch-checked-thumb-border-color: "var(--primary-color)"

  # Cards nested inside stack-in-card cards lose their own border/background
  card-mod-card: |
    :host-context(vertical-stack-in-card) ha-card:not([style*="solid 0.5px"]):not([style*="0.5px solid"]):not([style*="position: absolute"][style*="background-color"]),
    :host-context(stack-in-card) ha-card:not([style*="solid 0.5px"]):not([style*="0.5px solid"]):not([style*="position: absolute"][style*="background-color"]) {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
    }
    :host(vertical-stack-in-card) ha-card:not([style*="solid 0.5px"]):not([style*="0.5px solid"]):not([style*="position: absolute"][style*="background-color"]):not([data-x]),
    :host(stack-in-card) ha-card:not([style*="solid 0.5px"]):not([style*="0.5px solid"]):not([style*="position: absolute"][style*="background-color"]):not([data-x]) {
      background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01)) !important;
      border: 1px solid rgba(255,255,255,0.07) !important;
      box-shadow: 0 8px 30px rgba(0,0,0,0.45) !important;
      backdrop-filter: none !important;
    }
    :host-context(vertical-stack-in-card) ha-card:is([style*="solid 0.5px"], [style*="0.5px solid"], [style*="position: absolute"][style*="background-color"]),
    :host-context(stack-in-card) ha-card:is([style*="solid 0.5px"], [style*="0.5px solid"], [style*="position: absolute"][style*="background-color"]) {
      border: 1px solid rgba(255,255,255,0.16) !important;
      border-radius: 14px !important;
    }
    :host(button-card) ha-card * {
      --ha-card-border-width: 0px;
      --ha-card-background: none;
      --ha-card-box-shadow: none;
      --ha-card-backdrop-filter: none;
      --glass-chip-bg: transparent;
      --glass-chip-border: transparent;
    }
    :host(mushroom-chip) ha-card {
      background: var(--glass-chip-bg, rgba(255,255,255,0.06)) !important;
      border: 1px solid var(--glass-chip-border, rgba(255,255,255,0.09)) !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
    }

  ha-color-primary-05: "#030a16"
  ha-color-primary-10: "#06152d"
  ha-color-primary-20: "#0d2a59"
  ha-color-primary-30: "#133f86"
  ha-color-primary-40: "#1953b3"
  ha-color-primary-50: "#2068df"
  ha-color-primary-60: "#4c86e6"
  ha-color-primary-70: "#79a5ec"
  ha-color-primary-80: "#a6c3f2"
  ha-color-primary-90: "#d2e1f9"
  ha-color-primary-95: "#e9f0fc"
  # Dropdown and popup surfaces
  wa-color-surface-default: "rgba(18,24,38,1)"
  ha-color-surface-default: "rgba(18,24,38,1)"
  wa-panel-border-radius: 18px
  ha-border-radius-md: 16px
  wa-shadow-l: "0 12px 40px rgba(0,0,0,0.55)"
  ha-box-shadow-m: "0 12px 40px rgba(0,0,0,0.55)"

  card-mod-theme: "Glass Blue"
  card-mod-view-yaml: |
    "*:first-child$": |
      #columns .column > * {
        padding-left: 5px;
        padding-right: 5px;
        padding-bottom: 5px;
      }
  # card-mod-card: |
  #   ha-card:active {
  #     transform: translateY(-1.5px);
  #     transition: 0s;
  #     box-shadow: 0 0.5px 2px 0 rgba(0, 0, 0, 0.16);
  #   }
  modes:
    light:
      # text
      primary-text-color: "#DDDDDD"
      # main interface colors
      primary-color: "#89B3F8"
      google-red: "#F18B82"
      google-green: "#80C994"
      google-yellow: "#FCD663"
      google-blue: "#89B3F8"
      google-violet: "#BB86FC"
      google-grey: "#BBBBBB"
      color-red: "241, 139, 130"
      color-green: "128, 201, 148"
      color-yellow: "252, 214, 99"
      color-blue: "137, 179, 248"
      color-theme: "221,221,221"
      color-purple: "102, 31, 255"
      color-grey: "187, 187, 187"
      color-pink: "233, 30, 99"
      color-background-yellow: "var(--color-yellow)"
      color-background-blue: "var(--color-blue)"
      color-background-green: "var(--color-green)"
      color-background-red: "var(--color-red)"
      color-background-pink: "var(--color-pink)"
      color-background-purple: "var(--color-purple)"
      color-yellow-text: "var(--color-yellow)"
      color-blue-text: "var(--color-blue)"
      color-green-text: "var(--color-green)"
      color-red-text: "var(--color-red)"
      color-pink-text: "var(--color-pink)"
      color-purple-text: "var(--color-purple)"
      opacity-bg: "0.1"
      # floating button text color
      mdc-theme-on-secondary: "var(--card-background-color)"
      # background and sidebar
      card-background-color: "#121826"
      primary-background-color: "#0b0f17"
      secondary-background-color: "#121826"
      # header
      app-header-text-color: "var(--primary-text-color)"
      app-header-background-color: "rgba(11,15,23,0.55)"
      paper-tabs-selection-bar-color: "var(--primary-text-color)"
      # Sidebar
      sidebar-selected-text-color: "rgb(var(--color-blue))"
      sidebar-selected-icon-color: "rgb(var(--color-blue))"
      # Slider
      slider-color: "rgb(var(--color-blue))"
      slider-bar-color: "rgba(var(--color-blue),0.38)"
      # card
      box-shadow: "none"
      # media player
      mini-media-player-accent-color: "var(--google-blue)"
      # Journal
      state-icon-color: "rgb(var(--color-theme))"

    dark:
      # text
      primary-text-color: "#DDDDDD"
      # main interface colors
      primary-color: "#89B3F8"
      google-red: "#F18B82"
      google-green: "#80C994"
      google-yellow: "#FCD663"
      google-blue: "#89B3F8"
      google-violet: "#BB86FC"
      google-grey: "#BBBBBB"
      color-red: "241, 139, 130"
      color-green: "128, 201, 148"
      color-yellow: "252, 214, 99"
      color-blue: "137, 179, 248"
      color-theme: "221,221,221"
      color-purple: "102, 31, 255"
      color-grey: "187, 187, 187"
      color-pink: "233, 30, 99"
      color-background-yellow: "var(--color-yellow)"
      color-background-blue: "var(--color-blue)"
      color-background-green: "var(--color-green)"
      color-background-red: "var(--color-red)"
      color-background-pink: "var(--color-pink)"
      color-background-purple: "var(--color-purple)"
      color-yellow-text: "var(--color-yellow)"
      color-blue-text: "var(--color-blue)"
      color-green-text: "var(--color-green)"
      color-red-text: "var(--color-red)"
      color-pink-text: "var(--color-pink)"
      color-purple-text: "var(--color-purple)"
      opacity-bg: "0.1"
      # floating button text color
      mdc-theme-on-secondary: "var(--card-background-color)"
      # background and sidebar
      card-background-color: "#121826"
      primary-background-color: "#0b0f17"
      secondary-background-color: "#121826"
      # header
      app-header-text-color: "var(--primary-text-color)"
      app-header-background-color: "rgba(11,15,23,0.55)"
      paper-tabs-selection-bar-color: "var(--primary-text-color)"
      # Sidebar
      sidebar-selected-text-color: "rgb(var(--color-blue))"
      sidebar-selected-icon-color: "rgb(var(--color-blue))"
      # Slider
      slider-color: "rgb(var(--color-blue))"
      slider-bar-color: "rgba(var(--color-blue),0.38)"
      # card
      box-shadow: "none"
      # media player
      mini-media-player-accent-color: "var(--google-blue)"
      # Journal
      state-icon-color: "rgb(var(--color-theme))"