    - name: "Pixel 8 Pro Media Volume Control"
      unique_id: pixel_media_volume
      icon: mdi:music-note
      state: "{{ states('sensor.pixel8pro_volume_level_music')|int(0) }}"
      step: 1
      min: 0
      max: 25
      set_value:
        - action: notify.mobile_app_pixel8pro
          data:
            message: command_volume_level
            data:
              media_stream: music_stream
              command: "{{ value|int }}"
      availability: "{{ has_value('sensor.pixel8pro_volume_level_music') }}"

    - name: "Pixel 8 Pro Notification Volume Control"
      unique_id: pixel_notification_volume
      icon: mdi:bell
      state: "{{ states('sensor.pixel8pro_volume_level_notification')|int(0) }}"
      step: 1
      min: 0
      max: 7
      set_value:
        - action: notify.mobile_app_pixel8pro
          data:
            message: command_volume_level
            data:
              media_stream: notification_stream
              command: "{{ value|int }}"
      availability: "{{ has_value('sensor.pixel8pro_volume_level_notification') }}"

    - name: "Pixel 8 Pro Ringer Volume Control"
      unique_id: pixel_ringer_volume
      icon: mdi:phone-ring
      state: "{{ states('sensor.pixel8pro_volume_level_ringer')|int(0) }}"
      step: 1
      min: 0
      max: 7
      set_value:
        - action: notify.mobile_app_pixel8pro
          data:
            message: command_volume_level
            data:
              media_stream: ring_stream
              command: "{{ value|int }}"
      availability: "{{ has_value('sensor.pixel8pro_volume_level_ringer') }}"

    - name: "Pixel 8 Pro System Volume Control"
      unique_id: pixel_system_volume
      icon: mdi:volume-medium
      state: "{{ states('sensor.pixel8pro_volume_level_system')|int(0) }}"
      step: 1
      min: 0
      max: 7
      set_value:
        - action: notify.mobile_app_pixel8pro
          data:
            message: command_volume_level
            data:
              media_stream: system_stream
              command: "{{ value|int }}"
      availability: "{{ has_value('sensor.pixel8pro_volume_level_system') }}"


- binary_sensor:
    - unique_id: chair_occupancy
      name: "Chair Occupancy"
      device_class: occupancy
      availability: "{{ states.binary_sensor.vibration_vibration.state != 'unavailable' }}"
      icon: "{{ iif(is_state('binary_sensor.chair_occupancy', 'on'), 'mdi:table-chair', 'mdi:account-off') }}"
      delay_off: "00:00:30"
      state: >-
        {{ max(
            as_timestamp(states.sensor.vibration_angle_x.last_changed),
            as_timestamp(states.sensor.vibration_angle_y.last_changed),
            as_timestamp(states.sensor.vibration_angle_z.last_changed)
          ) > (as_timestamp(now()) - 30) or is_state('binary_sensor.vibration_vibration', 'on')
        }}

    - unique_id: hacs_updates
      name: "HACS Updates"
      device_class: update
      icon: mdi:package-up
      availability: "{{ states.update | selectattr('state', 'eq', 'on') | selectattr('entity_id', 'in', integration_entities('hacs')) | map(attribute='name') | list | count | int(-1) > -1 }}"
      state: "{{ states.update | selectattr('state', 'eq', 'on') | selectattr('entity_id', 'in', integration_entities('hacs')) | map(attribute='name') | list | count }}"

    - unique_id: addon_updates
      name: "Add-on Updates"
      device_class: update
      icon: mdi:package-up
      availability: "{{ states.update | selectattr('state', 'eq', 'on') | selectattr('entity_id', 'in', integration_entities('hassio')) | rejectattr('entity_id', 'eq', 'update.home_assistant_core_update') | map(attribute='name') | list | count | int(-1) > -1 }}"
      state: "{{ states.update | selectattr('state', 'eq', 'on') | selectattr('entity_id', 'in', integration_entities('hassio')) | rejectattr('entity_id', 'eq', 'update.home_assistant_core_update') | map(attribute='name') | list | count }}"

    - unique_id: other_updates
      name: "Other Updates"
      device_class: update
      icon: mdi:package-up
      availability: "{{ states.update | selectattr('state', 'eq', 'on') | rejectattr('entity_id', 'in', integration_entities('hassio')) | rejectattr('entity_id', 'in', integration_entities('hacs')) | map(attribute='name') | list | count | int(-1) > -1 }}"
      state: "{{ states.update | selectattr('state', 'eq', 'on') | rejectattr('entity_id', 'in', integration_entities('hassio')) | rejectattr('entity_id', 'in', integration_entities('hacs')) | map(attribute='name') | list | count }}"