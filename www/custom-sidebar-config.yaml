# Shared look, taken from the glass themes (themes/glass*.yaml)
extendable_configs:
  glass:
    title: "SkyNet HQ"
    subtitle: "Home Assistant"
    divider_color: var(--sidebar-divider-color)
    menu_background: transparent
    sidebar_border_color: var(--sidebar-divider-color)
    sidebar_background: var(--sidebar-background-color)
    icon_color: var(--sidebar-icon-color)
    text_color: var(--sidebar-text-color)
    icon_color_selected: var(--sidebar-selected-icon-color, var(--primary-color))
    text_color_selected: var(--sidebar-selected-text-color, var(--primary-color))
    notification_color: var(--primary-color)
    notification_text_color: var(--primary-background-color)

# An exception replaces the root config, so hide_all has to be set inside each one.
# Everything not listed with `hide: false` (or created with `new_item`) is hidden.
exceptions:
  - is_admin: false
    extend_from: glass
    hide_all: true
    sidebar_editable: false
    order:
      - item: Overview
        hide: false
      - item: Settings
        hide: false
        bottom: true
      - item: Notifications
        hide: false
        bottom: true
      - item: /profile
        match: href
        hide: false
        bottom: true

  - is_admin: true
    extend_from: glass
    hide_all: true
    sidebar_editable: true
    order:
      - item: Overview
        hide: false

      - item: Tablet
        hide: false

      - item: Marketplace
        new_item: true
        href: "/marketplace"
        icon: mdi:store
        info: >
          Total : {{ states.update |  selectattr('entity_id', 'in', integration_entities('marketplace')) | map(attribute='name') | list | count }}
        notification: >
          {{ states.update | selectattr('entity_id', 'in', integration_entities('marketplace')) | selectattr('state', 'eq', 'on') | list | count or '' }}

      - item: Logbook
        hide: false

      - new_item: true
        item: Automations
        href: "/config/automation/dashboard"
        icon: mdi:robot-confused-outline
        info: |
          Total {{ states.automation | list | count }} | active {{ states.automation | selectattr('state', 'eq', 'on') | list | count }}

      - item: Frigate
        hide: false

      # - new_item: true
      #   item: Tags
      #   href: "/config/tags"
      #   icon: mdi:nfc-variant
      #   bottom: true

      - new_item: true
        item: Logs
        bottom: true
        href: "/config/logs"
        icon: mdi:math-log

      - new_item: true
        item: Integrations
        href: "/config/integrations"
        icon: mdi:devices
        bottom: true

      - new_item: true
        item: Apps
        href: "/config/apps"
        icon: mdi:puzzle
        bottom: true

      - new_item: true
        item: Reboot
        href: "/config/tools/yaml"
        icon: mdi:restart
        bottom: true

      - new_item: true
        item: "dev_tools"
        name: "Developer Tools"
        href: "/config/tools/state"
        icon: mdi:hammer
        bottom: true

      - item: Settings
        hide: false
        bottom: true

      - new_item: true
        item: info
        name: '[[[ return "Core " + state_attr("update.home_assistant_core_update", "installed_version") ]]]'
        info: '[[[ "Supervisor " + state_attr("update.home_assistant_supervisor_update", "installed_version") ]]]'
        href: '/config/info'
        icon: mdi:information-outline
        bottom: true
        divider: true
        divider_color: var(--sidebar-divider-color)

      - item: Notifications
        hide: false
        bottom: true
      - item: /profile
        match: href
        hide: false
        bottom: true
