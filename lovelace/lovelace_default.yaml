---
button_card_templates:
  app_launcher:
    aspect_ratio: 21/9
    entity_picture: "[[[ \n  const icon = variables.app_icon || variables.app_name.toLowerCase().replace(/\
      \ /g, '');\n  return `/local/images/icons/${icon}.png`;\n]]]\n"
    hold_action:
      action: none
    layout: vertical
    show_entity_picture: true
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 10px
      - border: solid 0.5px var(--primary-color)
      - box-shadow: none
      - padding: 0px 0px
      - margin: 0px
      - background-color: '[[[ return variables.card_color || ''rgba(0, 0, 0, 0)'';
          ]]]'
      entity_picture:
      - width: '[[[ return variables.icon_width || ''25%''; ]]]'
    tap_action:
      action: call-service
      service: remote.turn_on
      service_data:
        activity: '[[[ return variables.app_name ]]]'
      target:
        entity_id: '[[[ return variables.target_remote ]]]'
  blank_button:
    aspect_ratio: 4/3
    color_type: icon
    hold_action:
      action: none
    layout: vertical
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 0px
      - border: solid 0px var(--primary-color)
      - box-shadow: none
      - padding: 6px 6px
      - margin: 0px 0px
      - --paper-card-background-color: rgba(0, 0, 0, 0)
    tap_action:
      action: none
  logo_button:
    aspect_ratio: 21/9
    color: rgb(255,255,255)
    color_type: card
    hold_action:
      action: none
    layout: vertical
    show_entity_picture: true
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 5px
      - border: solid 0.5px var(--primary-color)
      - box-shadow: none
      - padding: 0px 0px
      - margin: 0px 0px
      entity_picture:
      - width: '[[[ return variables.icon_width || ''100%''; ]]]'
      icon:
      - width: 50px
    tap_action:
      action: call-service
swipe_nav:
  animate: fade
  enable_mouse_swipe: true
title: Mad House
views:
- badges: []
  card_mod:
    style: "* {\n  box-sizing: border-box !important;\n}\nhui-sections-view > * {\n\
      \  display: grid !important;\n  grid-template-columns: repeat(2, 1fr) !important;\n\
      \  gap: 8px !important;\n}\nhui-sections-view > * > * {\n  height: 200px !important;\n\
      \  width: 100% !important;\n}\n"
  cards: []
  dense_section_placement: true
  header:
    badges_position: bottom
    card:
      name: Pat
      show_icon: true
      show_message: true
      type: custom:greeting-card
      weather_entity: weather.home
    layout: responsive
  icon: mdi:view-dashboard-outline
  layout: {}
  max_columns: 3
  path: dashboard
  sections:
  - cards:
    - buttons:
      - entity: light.light
        icon: mdi:lightbulb-on
      - entity: light.shapes
        icon: mdi:hexagon-multiple
      - color: '[[[ return is(''switch.workstation'',''on'')?''deep-orange'':''disabled'';
          ]]]'
        entity: switch.workstation
        icon: mdi:desk
      color: '[[[ return is(''binary_sensor.den_motion_occupancy'',''on'')?''light-blue'':''disabled'';
        ]]]'
      grid_options:
        columns: 6
        rows: auto
      hold_action:
        action: none
      icon: mdi:skull
      name: Den
      picture: '[[[ return is(''binary_sensor.den_motion_occupancy'',''on'') ? ''/local/images/floorplan/den.svg?v=1''
        : ''''; ]]]'
      picture_style: object-fit:contain
      secondary: '[[[ const f=v=>isNaN(parseFloat(v))?''N/A'':parseFloat(v).toFixed(1);
        return ''{mdi:thermometer} ''+f(s(''sensor.den_temperature''))+'' °C | {mdi:water}
        ''+f(s(''sensor.den_humidity''))+'' %''; ]]]'
      tap_action:
        action: navigate
        navigation_path: /lovelace/den
      type: custom:room-tile
    - buttons:
      - entity: light.living_room_lamp
        icon: mdi:lamp
      - entity: light.chandelier
        icon: mdi:chandelier
      - entity: light.led_strip
        icon: mdi:led-strip-variant
      - color: '[[[ return (!is(''media_player.google_tv_streamer'',''off'') && !is(''media_player.google_tv_streamer'',''unavailable''))
          ? ''green'' : ''disabled''; ]]]'
        entity: media_player.google_tv_streamer
        icon: mdi:monitor
      color: '[[[ return is(''binary_sensor.living_room_presence'',''on'')?''yellow'':''disabled'';
        ]]]'
      grid_options:
        columns: 6
        rows: auto
      hold_action:
        action: none
      icon: mdi:sofa
      name: Living Room
      secondary: '[[[ const f=v=>isNaN(parseFloat(v))?''N/A'':parseFloat(v).toFixed(1);
        return ''{mdi:thermometer} ''+f(s(''sensor.living_room_temperature''))+''
        °C | {mdi:water} ''+f(s(''sensor.living_room_humidity''))+'' %''; ]]]'
      tap_action:
        action: navigate
        navigation_path: /lovelace/living-room?anchor=livingroom
      type: custom:room-tile
    - buttons:
      - entity: light.kitchen_light
        icon: mdi:dome-light
      - animation: '[[[ return is(''switch.kettle'',''on'')?''boil'':''''; ]]]'
        color: '[[[ return is(''switch.kettle'',''on'')?''red'':''disabled''; ]]]'
        entity: switch.kettle
        icon: '[[[ return is(''switch.kettle'',''on'')?''mdi:kettle-steam'':''mdi:kettle-off'';
          ]]]'
      - entity: light.backyard_lights
        icon: mdi:string-lights
      color: '[[[ return is(''binary_sensor.kitchen_presence'',''on'')?''green'':''disabled'';
        ]]]'
      grid_options:
        columns: 6
        rows: auto
      hold_action:
        action: none
      icon: mdi:countertop-outline
      name: Kitchen
      picture: '[[[ return is(''binary_sensor.kitchen_presence'',''on'') ? ''/local/images/floorplan/kitchen.svg?v=1''
        : ''''; ]]]'
      picture_style: object-fit:contain
      secondary: '[[[ const f=v=>isNaN(parseFloat(v))?''N/A'':parseFloat(v).toFixed(1);
        return ''{mdi:thermometer} ''+f(s(''sensor.kitchen_temperature_and_humidity_temperature''))+''
        °C | {mdi:water} ''+f(s(''sensor.kitchen_temperature_and_humidity_humidity''))+''
        %''; ]]]'
      tap_action:
        action: navigate
        navigation_path: /lovelace/living-room?anchor=kitchen
      type: custom:room-tile
    - buttons:
      - entity: light.string_lights
        icon: mdi:string-lights
      - entity: light.hallway_chandelier
        icon: mdi:chandelier
      color: '[[[ return is(''binary_sensor.hallway_motion_occupancy'',''on'')?''pink'':''disabled'';
        ]]]'
      grid_options:
        columns: 6
        rows: auto
      hold_action:
        action: none
      icon: mdi:key-chain-variant
      name: Hallway
      picture: '[[[ return is(''binary_sensor.hallway_motion_occupancy'',''on'') ?
        ''/local/images/floorplan/hallway.svg?v=1'' : ''''; ]]]'
      picture_style: object-fit:contain
      secondary: '[[[ const v=parseFloat(s(''sensor.hallway_motion_device_temperature''));
        return ''{mdi:thermometer} ''+(isNaN(v)?''N/A'':v.toFixed(1))+'' °C''; ]]]'
      tap_action:
        action: navigate
        navigation_path: /lovelace/living-room?anchor=hallway
      type: custom:room-tile
    - buttons:
      - entity: binary_sensor.porch_motion_occupancy
        icon: '[[[ return is(''binary_sensor.porch_motion_occupancy'',''on'')?''mdi:motion-sensor'':''mdi:motion-sensor-off'';
          ]]]'
        tap_action:
          action: more-info
      - entity: light.porch_light
        icon: mdi:ceiling-light
      color: disabled
      entity: camera.doorbell
      grid_options:
        columns: 6
        rows: auto
      hold_action:
        action: more-info
      icon: ''
      name: Doorbell
      picture: '[[[ return a(''camera.doorbell_snapshot'',''entity_picture''); ]]]'
      refresh: 60
      secondary: '[[[ const t=a(''automation.doorbell_automations'',''last_triggered'');
        return t?rel(t)+'' ago'':''No recent activity''; ]]]'
      secondary_offset: -3
      secondary_size: 12
      shape_left: -20
      shape_top: 65
      tap_action:
        action: navigate
        navigation_path: /lovelace/living-room?anchor=doorbell
      type: custom:room-tile
    - badge:
        color: '[[[ if(is(''input_boolean.bin'',''on'')) return ''green''; const b=a(''sensor.black_bin'',''next_collection''),l=a(''sensor.blue_bin'',''next_collection'');
          const n=Math.min(b,l); return n>5?''green'':n>2?''yellow'':''red''; ]]]'
        left: 95
        text: '[[[ if(is(''input_boolean.bin'',''on'')) return ''✔''; const b=a(''sensor.black_bin'',''next_collection''),l=a(''sensor.blue_bin'',''next_collection'');
          return (b==null||l==null)?'''':String(Math.min(b,l)); ]]]'
        top: 85
      buttons:
      - entity: sensor.blue_bin
        hold_action:
          action: more-info
        picture: /local/images/bins/blue_bin.png
        picture_style: filter:brightness(1) contrast(3)
        size: 50
        tap_action:
          action: more-info
      - entity: sensor.black_bin
        hold_action:
          action: more-info
        picture: /local/images/bins/black_bin.png
        picture_style: filter:brightness(2) contrast(3)
        size: 55
        tap_action:
          action: more-info
      - badge:
          color: '[[[ return is(''input_boolean.bin'',''on'')?''green'':''red''; ]]]'
          icon: '[[[ const b=a(''sensor.black_bin'',''next_collection''),l=a(''sensor.blue_bin'',''next_collection'');
            if(b<=2||l<=2) return is(''input_boolean.bin'',''on'')?''mdi:check'':''mdi:arrow-down'';
            return ''''; ]]]'
        color: '[[[ if(!is(''input_boolean.bin'',''on'')) return ''disabled''; if(a(''sensor.black_bin'',''next_collection'')<=1)
          return ''black''; if(a(''sensor.blue_bin'',''next_collection'')<=1) return
          ''blue''; return ''disabled''; ]]]'
        double_tap_action:
          action: toggle
        entity: input_boolean.bin
        hold_action:
          action: more-info
        icon: '[[[ return is(''input_boolean.bin'',''on'')?''fas:trash-can-arrow-up'':''mdi:delete-off-outline'';
          ]]]'
        size: 40
        tap_action:
          action: none
      color: disabled
      grid_options:
        columns: 6
        rows: auto
      hold_action:
        action: none
      icon: ''
      name: '[[[ const b=a(''sensor.black_bin'',''next_collection''),l=a(''sensor.blue_bin'',''next_collection'');
        return (b&&l)?(b<l?''Black Bin'':''Blue Bin''):''Bin Collection''; ]]]'
      picture: '[[[ const b=a(''sensor.black_bin'',''next_collection''),l=a(''sensor.blue_bin'',''next_collection'');
        return (b&&l)?(b<l?''/local/images/bins/black_bin.png'':''/local/images/bins/blue_bin.png''):''/local/images/bins/black_bin.png'';
        ]]]'
      picture_style: filter:brightness(1) contrast(3)
      secondary: '[[[ const b=a(''sensor.black_bin'',''next_collection''),l=a(''sensor.blue_bin'',''next_collection'');
        return (b&&l)?''on ''+(b<l?s(''sensor.black_bin''):s(''sensor.blue_bin'')):''Check
        schedule''; ]]]'
      shape_left: -30
      shape_top: 62
      tap_action:
        action: navigate
        navigation_path: /lovelace/living-room?anchor=bins
      type: custom:room-tile
    - animation: '[[[ const m={running:''washing'',washing:''washing'',door_locked:''washing'',spinning:''spinning'',rinsing:''rinsing'',drying:''drying'',cycle_complete:''pulse''};
        return m[s(''sensor.bob_machine_status'')]||''''; ]]]'
      card_mod:
        style: ".x {\n  left: auto !important;\n  right: 16px;\n  text-align: right;\n\
          }\n"
      color: '[[[ const m={idle:''blue-grey'',starting:''blue'',delayed_start:''amber'',running:''cyan'',washing:''cyan'',door_locked:''cyan'',add_laundry:''cyan'',spinning:''purple'',rinsing:''blue'',drying:''deep-orange'',paused:''orange'',cycle_complete:''green''};
        return m[s(''sensor.bob_machine_status'')]||''disabled''; ]]]'
      extras:
      - entity: sensor.bob_duration
        label: Duration
        show: '[[[ return s(''sensor.bob_duration'')!==''unavailable'' && ![''cycle_complete'',''off'',''unavailable''].includes(s(''sensor.bob_machine_status''));
          ]]]'
        top: 70
        value: '[[[ let m=parseFloat(s(''sensor.bob_duration'')); if(isNaN(m)) return
          ''''; const u=a(''sensor.bob_duration'',''unit_of_measurement''); m=Math.round(u===''h''?m*60:u===''s''?m/60:m);
          const h=Math.floor(m/60), r=m%60; return h ? h+''h''+(r?'' ''+r+''m'':'''')
          : r+''m''; ]]]'
      - entity: sensor.bob_remaining
        label: Remaining
        show: '[[[ return s(''sensor.bob_remaining'')!==''unavailable'' && ![''cycle_complete'',''off'',''unavailable''].includes(s(''sensor.bob_machine_status''));
          ]]]'
        top: 122
        value: '[[[ let m=parseFloat(s(''sensor.bob_remaining'')); if(isNaN(m)) return
          ''''; const u=a(''sensor.bob_remaining'',''unit_of_measurement''); m=Math.round(u===''h''?m*60:u===''s''?m/60:m);
          const h=Math.floor(m/60), r=m%60; return h ? h+''h''+(r?'' ''+r+''m'':'''')
          : r+''m''; ]]]'
      grid_options:
        columns: 6
        rows: auto
      icon: '[[[ const m={off:''mdi:washing-machine-off'',idle:''mdi:washing-machine'',delayed_start:''phu:rooms-laundry-room'',starting:''mdi:washing-machine'',running:''mdi:washing-machine'',washing:''mdi:washing-machine'',rinsing:''mdi:dishwasher'',spinning:''fas:spinner'',drying:''mdi:tumble-dryer'',paused:''mdi:pause-box-outline'',door_locked:''mdi:washing-machine'',add_laundry:''mdi:washing-machine'',cycle_complete:''mdi:check-circle-outline'',unavailable:''mdi:washing-machine-alert''};
        return m[s(''sensor.bob_machine_status'')]||''mdi:washing-machine-alert'';
        ]]]'
      name: Washing Machine
      picture: '[[[ const m={running:''washing'',washing:''washing'',door_locked:''washing'',add_laundry:''washing'',rinsing:''rinsing'',spinning:''spinning'',drying:''drying'',cycle_complete:''cycle_complete'',paused:''paused'',delayed_start:''delayed_start''};
        const f=m[s(''sensor.bob_machine_status'')]; return f ? ''/local/images/washer/''+f+''.svg?v=1''
        : ''''; ]]]'
      picture_style: object-fit:contain
      secondary: '[[[ const m={off:''Off'',idle:''Idle'',delayed_start:''Delayed Start'',starting:''Starting'',running:''Washing'',washing:''Washing'',rinsing:''Rinsing'',spinning:''Spinning'',drying:''Drying'',paused:''Paused'',door_locked:''Washing'',add_laundry:''Washing'',cycle_complete:''Cycle
        Complete'',unavailable:''Status Unknown''}; return m[s(''sensor.bob_machine_status'')]||''Status
        Unknown''; ]]]'
      tap_action:
        action: navigate
        navigation_path: /lovelace/utilities
      type: custom:room-tile
    - buttons:
      - animation: '[[[ return is(''switch.boiler'',''on'')?''boil'':''''; ]]]'
        color: '[[[ return is(''switch.boiler'',''on'')?''red'':''disabled''; ]]]'
        entity: switch.boiler
        icon: '[[[ return is(''switch.boiler'',''on'')?''mdi:water-boiler'':''mdi:water-boiler-off'';
          ]]]'
        shape_animation: '[[[ return is(''switch.boiler'',''on'')?''ping'':''''; ]]]'
      - animation: '[[[ return is(''climate.heater'',''heat'')?''fire'':''''; ]]]'
        color: '[[[ return is(''climate.heater'',''heat'')?''red'':''disabled''; ]]]'
        entity: climate.heater
        icon: '[[[ return is(''climate.heater'',''heat'')?''mdi:fire'':''mdi:fire-off'';
          ]]]'
      - color: '[[[ return is(''switch.bed_warmer'',''on'')?''red'':''disabled'';
          ]]]'
        entity: switch.bed_warmer
        icon: m3o:blanket
      card_mod:
        style: ".bar {\n  height: 6px !important;\n  top: 56px !important;\n  border-radius:\
          \ 6px !important;\n}\n"
      color: '[[[ return is(''switch.heating'',''on'')?''red'':''disabled''; ]]]'
      grid_options:
        columns: 6
        rows: auto
      hold_action:
        action: none
      icon: '[[[ return is(''switch.heating'',''on'')?''mdi:radiator'':''mdi:radiator-off'';
        ]]]'
      name: Heating
      picture: '[[[ return is(''switch.heating'',''on'') ? ''/local/images/status/heating-on.svg?v=1''
        : ''''; ]]]'
      picture_style: object-fit:contain
      secondary: '[[[ const w=o(''switch.heating''); return w?''Turned ''+w.state+''
        at ''+new Date(w.last_changed).toLocaleTimeString(''en-IE'',{hour:''numeric'',minute:''2-digit'',hour12:true}).toUpperCase():'''';
        ]]]'
      secondary_size: 12
      tap_action:
        action: call-service
        service: switch.toggle
        service_data:
          entity_id: switch.heating
      timer:
        color: red
        entity: timer.heating
      type: custom:room-tile
    - buttons:
      - entity: light.guest_light
        icon: mdi:globe-light
      - entity: light.guest_bed_light
        icon: mdi:lamp
      color: '[[[ return (is(''light.guest_bed_light'',''on'')||s(''sensor.tp_link_router_total_guest_wifi_clients'')!==''0'')?''#5dfccd'':''disabled'';
        ]]]'
      grid_options:
        columns: 6
        rows: auto
      hold_action:
        action: none
      icon: mdi:bag-suitcase-outline
      name: Guest
      picture: '[[[ return (is(''light.guest_bed_light'',''on'') || ![''0'',''unavailable'',''unknown''].includes(s(''sensor.tp_link_router_total_guest_wifi_clients'')))
        ? ''/local/images/floorplan/guest.svg?v=1'' : ''''; ]]]'
      picture_style: object-fit:contain
      secondary: '[[[ const n=s(''sensor.tp_link_router_total_guest_wifi_clients'');
        return ''{mdi:wifi} ''+(n!==''unavailable''?n:''0'')+'' devices''; ]]]'
      tap_action:
        action: navigate
        navigation_path: /lovelace/living-room?anchor=guest
      type: custom:room-tile
    - buttons:
      - entity: light.backyard_lights
        icon: mdi:string-lights
      - entity: light.alleyway_lights
        icon: mdi:light-recessed
      - entity: binary_sensor.back_door_contact
        icon: '[[[ return is(''binary_sensor.back_door_contact'',''on'')?''mdi:door-open'':''mdi:door-closed'';
          ]]]'
        tap_action:
          action: more-info
      color: '[[[ return (is(''light.backyard_lights'',''on'')||is(''light.alleyway_lights'',''on'')||is(''binary_sensor.back_door_contact'',''on''))?''purple'':''disabled'';
        ]]]'
      grid_options:
        columns: 6
        rows: auto
      hold_action:
        action: none
      icon: mdi:tent
      name: Backyard
      picture: '[[[ return (is(''light.backyard_lights'',''on'') || is(''light.alleyway_lights'',''on'')
        || is(''binary_sensor.back_door_contact'',''on'')) ? ''/local/images/floorplan/backyard.svg?v=1''
        : ''''; ]]]'
      picture_style: object-fit:contain
      secondary: '[[[ const f=v=>isNaN(parseFloat(v))?''N/A'':parseFloat(v).toFixed(1);
        return ''{mdi:thermometer} ''+f(s(''sensor.hygrometer_temperature''))+'' °C
        | {mdi:water} ''+f(s(''sensor.hygrometer_humidity''))+'' %''; ]]]'
      tap_action:
        action: navigate
        navigation_path: /lovelace/living-room?anchor=kitchen
      type: custom:room-tile
    - cards:
      - card_mod:
          style: "ha-card {\n  height: 200px !important;\n  border-style: dashed;\n\
            \  border-width: 2px;\n}\n"
        cards:
        - card_mod:
            style: '.p { font-size: 20px !important; }

              .q { font-size: 13px !important; position: relative; top: 4px; }'
          rows:
          - hold_action:
              action: none
            primary: Internet Speed
            secondary: '[[[ return ''{mdi:download} ''+s(''sensor.speedtest_download'')+''
              Mbps |  {mdi:upload} ''+s(''sensor.speedtest_upload'')+'' Mbps''; ]]]'
            tap_action:
              action: call-service
              data:
                addon: 6b87c29e_speedtest_addon
              service: hassio.addon_start
              target: {}
          type: custom:icon-rows
        - entities:
          - color: '#f24d1b'
            entity: sensor.speedtest_download
          hours_to_show: 24
          line_width: 5
          show:
            fill: fade
            icon: false
            legend: false
            name: false
            state: false
          type: custom:mini-graph-card
        - entities:
          - color: '#0960eb'
            entity: sensor.speedtest_upload
          hours_to_show: 24
          line_width: 5
          show:
            fill: fade
            icon: false
            legend: false
            name: false
            state: false
          type: custom:mini-graph-card
        mode: vertical
        type: custom:stack-in-card
      - card_mod:
          style: "ha-card {\n  height: 200px !important;\n  border-style: dashed;\n\
            \  border-width: 2px;\n}\n"
        cards:
        - card_mod:
            style: '.r { min-height: 46px; padding: 4px 20px; }'
          rows:
          - color: '[[[ const v=parseFloat(s(''sensor.system_monitor_disk_use_percent''));
              return isNaN(v)?''disabled'':v<=50.99?''green'':v<=70.99?''orange'':''red'';
              ]]]'
            entity: sensor.system_monitor_disk_use
            hold_action:
              action: none
            icon: mdi:harddisk
            primary: '[[[ const v=s(''sensor.system_monitor_disk_use''); return (v!==''unavailable''?v:''N/A'')+''
              GB''; ]]]'
            secondary: Hard Disk
            tap_action:
              action: more-info
          - color: '[[[ const v=parseFloat(s(''sensor.system_monitor_disk_usage_media_1tb_ssd''));
              return isNaN(v)?''disabled'':v<=50.99?''green'':v<=70.99?''orange'':''red'';
              ]]]'
            entity: sensor.system_monitor_disk_use_media_1tb_ssd
            hold_action:
              action: none
            icon: cbi:seagate-ssd-m2
            primary: '[[[ const v=s(''sensor.system_monitor_disk_use_media_1tb_ssd'');
              return (v!==''unavailable''?v:''N/A'')+'' GB''; ]]]'
