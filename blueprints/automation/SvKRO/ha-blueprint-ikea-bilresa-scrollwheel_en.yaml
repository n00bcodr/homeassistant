blueprint:
  name: IKEA BILRESA - Light Controller (v1.1)
  description: 'Light control for IKEA BILRESA (Matter). Supports dynamic scrolling,
    scene cycling, and multi-click actions for up to three channels.

    '
  domain: automation
  input:
    remote_device:
      name: Remote Control
      description: The IKEA BILRESA scroll wheel (Matter) used as the trigger.
      selector:
        device:
          filter:
          - manufacturer: IKEA of Sweden
            model: BILRESA scroll wheel
          multiple: false
    header_1:
      name: Channel 1
      default: ''
      selector:
        constant:
          value: ''
    group_scroll_1:
      name: Scroll Wheel Settings
      icon: mdi:rotate-right
      collapsed: true
      input:
        input_light_1:
          name: Light / Light Group
          description: Select the light or group to be controlled.
          default: {}
          selector:
            target:
              entity:
              - domain:
                - light
        input_mode_1:
          name: Scroll Function
          description: Define which value is changed when turning the wheel.
          default: brightness
          selector:
            select:
              mode: dropdown
              options:
              - label: Brightness
                value: brightness
              - label: Color
                value: hs_color
              - label: Color temperature
                value: temp_kelvin
              sort: false
              multiple: false
              custom_value: false
        input_sens_1:
          name: Multiplier
          description: Define how much the value should change with each scroll step.
          default: 5
          selector:
            number:
              min: 1.0
              max: 50.0
              unit_of_measurement: x
              mode: slider
              step: 1.0
        input_transition_1:
          name: Transition duration
          description: Define how long the transition between changes should take.
          default: 200
          selector:
            number:
              min: 0.0
              max: 5000.0
              unit_of_measurement: ms
              mode: slider
              step: 1.0
    group_single_click_1:
      name: Single Click
      icon: mdi:gesture-tap
      collapsed: true
      input:
        input_click_mode_1:
          name: Click Mode
          description: Choose between a single action or cycling through scenes.
          default: action
          selector:
            select:
              mode: dropdown
              options:
              - label: Perform single action
                value: action
              - label: Scene cycler
                value: scene_cycle
              sort: false
              multiple: false
              custom_value: false
        input_scenes_1:
          name: Scene Selection
          description: Select the scenes to cycle through sequentially.
          default: []
          selector:
            entity:
              domain:
              - scene
              multiple: true
              reorder: false
        input_click_1:
          name: Action on Click
          description: Action to perform when in 'Single Action' mode.
          default: []
          selector:
            action: {}
    group_multi_click_1:
      name: Additional Button Functions
      icon: mdi:plus-circle-outline
      collapsed: true
      input:
        input_double_1:
          name: Double Click
          description: Action to perform on double press.
          default: []
          selector:
            action: {}
        input_triple_1:
          name: Triple Click
          description: Action to perform on triple press.
          default: []
          selector:
            action: {}
        input_long_1:
          name: Hold
          description: Action to perform when holding the button.
          default: []
          selector:
            action: {}
        input_release_1:
          name: Release
          description: Action to perform when releasing the button after a long press.
          default: []
          selector:
            action: {}
    header_2:
      name: Channel 2
      default: ''
      selector:
        constant:
          value: ''
    group_scroll_2:
      name: Scroll Wheel Settings
      icon: mdi:rotate-right
      collapsed: true
      input:
        input_light_2:
          name: Light / Light Group
          description: Select the light or group to be controlled.
          default: {}
