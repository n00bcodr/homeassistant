              mode: slider
              step: 1.0
        input_transition_2:
          name: Transition duration
          description: Define how long the transition between changes should take.
          default: 200
          selector:
            number:
              min: 0.0
              max: 5000.0
              unit_of_measurement: ms
              mode: slider
              step: 1.0
    group_single_click_2:
      name: Single Click
      icon: mdi:gesture-tap
