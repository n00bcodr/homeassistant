- id: '1784467219253'
  alias: "\U0001F514Backyard Person Detected"
  description: Sends a snapshot to Pixel 8 Pro when Frigate detects a person on the
    backyard camera
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.backyard_camera_person_occupancy
    from: 'off'
    id: person
    to: 'on'
  conditions: []
  actions:
  - alias: Set camera_snapshot, timestamp
    variables:
      camera_snapshot: '{{ timestamp }}.jpg'
      timestamp: '{{ as_timestamp(trigger.to_state.last_changed) | timestamp_custom(''%Y-%m-%d_%H-%M-%S'')
        }}'
  - action: camera.snapshot
    alias: Take a Camera Snapshot
    data:
      filename: /config/www/backyard/{{ camera_snapshot }}
    target:
      entity_id:
      - camera.backyard_camera
  - action: notify.mobile_app_pixel8pro
    alias: Notify Pixel 8 Pro
    data:
      data:
        actions:
        - action: URI
          icon: sfsymbols:camera.viewfinder
          title: Open
          uri: /lovelace/camera
        activationMode: foreground
        channel: Backyard
        entity_id: camera.backyard_camera
        image: /local/backyard/{{ camera_snapshot }}
        notification_icon: mdi:cctv
        push:
          category: camera
          interruption-level: time-sensitive
        tag: backyard_person
        ttl: 0
        icon_url: /local/images/emoji/person.png
      message: ' '
      title: "Person detected in the backyard \U0001F464"
  - alias: Wait 5 s
    delay:
      hours: 0
      milliseconds: 0
      minutes: 0
      seconds: 5
  mode: single
- id: '1785876857918'
  alias: "\U0001F4A1Backyard Lights on Person Detected"
  description: Turns on backyard lights when Frigate detects a person on the backyard
    camera, and off again after 10 minutes of no detection
  triggers:
  - trigger: state
    entity_id: binary_sensor.backyard_camera_person_occupancy
    id: person_on
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.backyard_camera_person_occupancy
    for:
      minutes: 10
    id: person_off
    to: 'off'
  conditions: []
  actions:
  - alias: 'Choose by Backyard Camera Person occupancy: ''on'' / ''off'''
    choose:
    - alias: 'If Backyard Camera Person occupancy turns ''on'': turn on Backyard Lights'
      conditions:
      - condition: trigger
        id: person_on
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.backyard_lights
    - alias: 'If Backyard Camera Person occupancy turns ''off'': turn off Backyard
        Lights'
      conditions:
      - condition: trigger
        id: person_off
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.backyard_lights
  mode: restart
- id: '1793187499966'
  alias: 'Tablet: screen follows hallway motion'
  description: Turns the Nexus 7 screen on when there is movement in the hallway (06:30
    to 23:00) and off after 10 minutes without movement, and always at 23:00.
  triggers:
  - trigger: state
    entity_id: binary_sensor.hallway_motion_occupancy
    id: motion
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.hallway_motion_occupancy
    for:
      minutes: 10
    id: idle
    to: 'off'
  - trigger: time
    at: '23:00:00'
    id: night
  conditions: []
  actions:
  - alias: 'Choose: Hallway motion turns ''on'' and time is 06:30-23:00 / Hallway
      motion turns ''off'' or it is 23:00:00'
    choose:
    - alias: 'If Hallway motion turns ''on'' and time is 06:30-23:00: turn on Nexus
        7 Screen'
      conditions:
      - condition: trigger
        id: motion
      - after: 06:30:00
        before: '23:00:00'
        condition: time
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.nexus_7_screen
    - alias: 'If Hallway motion turns ''off'' or it is 23:00:00: turn off Nexus 7
        Screen'
      conditions:
      - condition: trigger
        id:
        - idle
        - night
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.nexus_7_screen
  mode: single
- id: '1793187506029'
  alias: 'Tablet: battery or power problem alert'
  description: Sends a phone notification when the Nexus 7 battery is low, the charger
    is lost, or the tablet goes offline.
  triggers:
  - trigger: numeric_state
    below: 20
    entity_id: sensor.nexus_7_battery
    for:
      minutes: 2
    id: low_battery
  - trigger: state
    entity_id: binary_sensor.nexus_7_plugged_in
    for:
      minutes: 5
    id: unplugged
    to: 'off'
  - trigger: state
    entity_id: sensor.nexus_7_battery
    for:
      minutes: 10
    id: offline
    to: unavailable
  conditions: []
  actions:
  - action: notify.send_message
    data:
      message: '{% if trigger.id == ''low_battery'' %}Battery is at {{ states(''sensor.nexus_7_battery'')
        }}%. Check the charger and cable.{% elif trigger.id == ''unplugged'' %}The
        charger is not connected.{% else %}The tablet has been offline for 10 minutes.{%
        endif %}'
      title: Nexus 7 tablet
    target:
      entity_id: notify.pixel8pro
  max_exceeded: silent
  mode: single
- id: '1793189889487'
  alias: 'Tablet: screen brightness follows room light'
  description: Sets the Nexus 7 screen brightness from its light sensor, and again
    whenever the screen turns on.
  triggers:
  - trigger: state
    entity_id: sensor.nexus_7_light_sensor
    for:
      minutes: 1
    id: light
  - trigger: state
    entity_id: switch.nexus_7_screen
    id: screen_on
    to: 'on'
  conditions:
  - condition: state
    entity_id: switch.nexus_7_screen
    state: 'on'
  actions:
  - alias: Choose by room light level (5 brightness steps)
    choose:
    - alias: 'If Nexus 7 Light sensor below 5: set value of Nexus 7 Screen brightness'
      conditions:
      - below: 5
        condition: numeric_state
        entity_id: sensor.nexus_7_light_sensor
      sequence:
      - action: number.set_value
        data:
          value: 25
        target:
          entity_id: number.nexus_7_screen_brightness
    - alias: 'If Nexus 7 Light sensor above 4.999 and below 30: set value of Nexus
        7 Screen brightness'
      conditions:
      - above: 4.999
        below: 30
        condition: numeric_state
        entity_id: sensor.nexus_7_light_sensor
      sequence:
      - action: number.set_value
        data:
          value: 60
        target:
          entity_id: number.nexus_7_screen_brightness
    - alias: 'If Nexus 7 Light sensor above 29.999 and below 100: set value of Nexus
        7 Screen brightness'
      conditions:
      - above: 29.999
        below: 100
        condition: numeric_state
        entity_id: sensor.nexus_7_light_sensor
      sequence:
      - action: number.set_value
        data:
          value: 105
        target:
          entity_id: number.nexus_7_screen_brightness
    - alias: 'If Nexus 7 Light sensor above 99.999 and below 250: set value of Nexus
        7 Screen brightness'
      conditions:
      - above: 99.999
        below: 250
        condition: numeric_state
        entity_id: sensor.nexus_7_light_sensor
      sequence:
      - action: number.set_value
        data:
          value: 155
        target:
          entity_id: number.nexus_7_screen_brightness
    - alias: 'If Nexus 7 Light sensor above 249.999: set value of Nexus 7 Screen brightness'
      conditions:
      - above: 249.999
        condition: numeric_state
        entity_id: sensor.nexus_7_light_sensor
      sequence:
      - action: number.set_value
        data:
          value: 205
        target:
          entity_id: number.nexus_7_screen_brightness
  mode: restart
- id: '1793281373867'
  alias: "\U0001F514Doorbell - Name the Person"
  description: When Frigate recognises a known face at the doorbell within 90 seconds
    of a doorbell alert, replace the generic alert with one that names them. Unknown
    people keep the generic 'Someone's at the front door' alert.
  triggers:
  - trigger: mqtt
    topic: frigate/tracked_object_update
    value_template: '{{ value_json.type }}:{{ value_json.camera }}'
    payload: face:doorbell
    alias: Frigate recognises a face on the doorbell camera
  conditions:
  - alias: The face belongs to a known person
    condition: template
    value_template: '{{ (trigger.payload_json.name | default('''') | string | lower)
      not in ['''', ''none'', ''unknown''] }}'
  - alias: A doorbell alert was sent in the last 90 seconds
    condition: template
    value_template: '{{ state_attr(''automation.doorbell_automations'', ''last_triggered'')
      is not none and (now() - state_attr(''automation.doorbell_automations'', ''last_triggered'')).total_seconds()
      < 90 }}'
  actions:
  - alias: Work out the person's name
    variables:
      who: '{{ trigger.payload_json.name | string | replace(''_'', '' '') | title
        }}'
  - alias: Replace the generic alert with one naming the person
    action: notify.all_phones
    data:
      message: ' '
      title: "{{ who }} is at the front door \U0001F464"
      data:
        ttl: 0
        tag: doorbell
        entity_id: camera.doorbell
        notification_icon: mdi:doorbell-video
        activationMode: foreground
        channel: Doorbell
        alert_once: true
        push:
          interruption-level: passive
          category: camera
        actions:
        - action: URI
          title: Open
          uri: /lovelace/camera
          icon: sfsymbols:camera.viewfinder
        - action: package
          title: Package
          icon: sfsymbols:cube.box
        - action: be_there
          title: Will be there
          icon: sfsymbols:person.crop.circle.badge.checkmark
        image: /local/cam_snapshot.jpg
        icon_url: /local/images/emoji/bell.png
  - alias: Cool down for 30 s so one visit gives one named alert
    delay:
      seconds: 30
  mode: single
- id: '1793282106838'
  alias: "\U0001F514Doorbell - Visit Clip"
  description: When Frigate closes a doorbell visit that triggered a doorbell alert,
    silently update that alert with a video clip of the visit (and the person's name
    if recognised). Skips visits that did not trigger an alert (e.g. suppressed by
    the 2-minute cooldown).
  triggers:
  - trigger: mqtt
    topic: frigate/reviews
    value_template: '{{ value_json.type }}:{{ value_json.after.camera }}:{{ value_json.after.severity
      }}'
    payload: end:doorbell:alert
    alias: Frigate finishes an alert-level visit on the doorbell camera
  conditions:
  - alias: A doorbell alert was sent during this visit
    condition: template
    value_template: '{% set t = state_attr(''automation.doorbell_automations'', ''last_triggered'')
      %}{{ t is not none and t.timestamp() >= (trigger.payload_json.after.start_time
      | float(0)) - 30 }}'
  - alias: Frigate has a tracked object to build the clip from
    condition: template
    value_template: '{{ (trigger.payload_json.after.data.detections | default([])
      | count) > 0 }}'
  - alias: The visit is short enough for a phone clip (Android limit is 50 MB, about
      80 s)
    condition: template
    value_template: '{{ (trigger.payload_json.after.end_time | float(0)) - (trigger.payload_json.after.start_time
      | float(0)) <= 70 }}'
  actions:
  - alias: Give Frigate 10 s to finish writing the clip
    delay:
      seconds: 10
  - alias: Work out the clip and who was seen
    variables:
      event_id: '{{ trigger.payload_json.after.data.detections[0] }}'
      who: '{% set s = trigger.payload_json.after.data.sub_labels | default([]) %}{{
        (s[0] | string | replace(''_'', '' '') | title) if (s | count) > 0 else ''''
        }}'
  - alias: Update the doorbell alert with the video clip
    action: notify.all_phones
    data:
      message: ' '
      title: "{{ who ~ ' was at the front door \U0001F3A5' if who else 'Front door
        visit \U0001F3A5' }}"
      data:
        ttl: 0
        tag: doorbell
        entity_id: camera.doorbell
        notification_icon: mdi:doorbell-video
        activationMode: foreground
        channel: Doorbell
        alert_once: true
        push:
          interruption-level: passive
          category: camera
        video: /api/frigate/notifications/{{ event_id }}/clip.mp4
        actions:
        - action: URI
          title: Open
          uri: /lovelace/camera
          icon: sfsymbols:camera.viewfinder
        - action: package
          title: Package
          icon: sfsymbols:cube.box
        - action: be_there
          title: Will be there
          icon: sfsymbols:person.crop.circle.badge.checkmark
        icon_url: /local/images/emoji/bell.png
  mode: queued
  max: 5
- id: '1793282457859'
  alias: "\U0001F4F9Backyard camera - detection only in daylight"
  description: The backyard camera looks through a window, so after dark it detects
    (and even names) people reflected from inside the house. This turns Frigate's
    person detection off for that camera while the sun is below the horizon and back
    on in daylight. Recording continues; only detection is paused. It re-applies the
    right state after a Home Assistant or Frigate restart.
  triggers:
  - trigger: sun
    event: sunset
    alias: Sunset
    id: dusk
  - trigger: sun
    event: sunrise
    alias: Sunrise
    id: dawn
  - trigger: homeassistant
    event: start
    alias: Home Assistant starts
    id: resync
  - trigger: state
    entity_id: switch.backyard_camera_detect
    from: unavailable
    alias: Frigate comes back (it forgets switch changes when it restarts)
    id: resync
  conditions: []
  actions:
  - alias: Wait 10 s so Frigate and MQTT are ready
    delay:
      seconds: 10
  - alias: Detection off after dark, on in daylight
    choose:
    - alias: 'After dark: turn the backyard detection off'
      conditions:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.backyard_camera_detect
    default:
    - alias: 'Daylight: turn the backyard detection on'
      action: switch.turn_on
      target:
        entity_id: switch.backyard_camera_detect
  mode: restart
