- id: '1715598723988'
  alias: "\U0001F514Doorbell"
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.doorbell_visitor
    from: 'off'
    to: 'on'
    id: doorbell
  - trigger: state
    entity_id:
    - binary_sensor.doorbell_person
    - binary_sensor.porch_motion_occupancy
    from: 'off'
    to: 'on'
    id: person
  conditions:
  - alias: Ring always goes through; a person alert needs 2 minutes since the last
      alert
    condition: template
    value_template: '{{ trigger.id == ''doorbell'' or this.attributes.last_triggered
      is none or (now() - this.attributes.last_triggered).total_seconds() > 120 }}'
  actions:
  - alias: Set timestamp, camera_snapshot
    variables:
      timestamp: '{{ as_timestamp(trigger.to_state.last_changed) | timestamp_custom(''%Y-%m-%d_%H-%M-%S'')
        }}'
      camera_snapshot: '{{ timestamp }}.jpg'
  - alias: Take a Camera Snapshot
    action: camera.snapshot
    metadata: {}
    data:
      filename: /config/www/doorbell/{{camera_snapshot}}
    target:
      entity_id:
      - camera.doorbell
  - alias: Take a Camera Snapshot - Cam SNAPSHOT
    action: camera.snapshot
    metadata: {}
    data:
      filename: /config/www/cam_snapshot.jpg
    target:
      entity_id:
      - camera.doorbell
  - alias: 'In parallel: Choose between motion and doorbell press; Send Notification
      on Google TV Streamer if it is on.; Send…'
    parallel:
    - alias: Choose between motion and doorbell press
      choose:
      - conditions:
        - condition: trigger
          id:
          - person
        sequence:
        - action: notify.all_phones
          metadata: {}
          data:
            message: ' '
            title: "Someone's at the front door \U0001F464"
            data:
              ttl: 0
              tag: doorbell
              entity_id: camera.doorbell
              notification_icon: mdi:doorbell-video
              activationMode: foreground
              channel: Doorbell
              push:
                interruption-level: time-sensitive
                category: camera
              actions:
              - action: URI
                title: Open
                uri: /lovelace/camera
                icon: sfsymbols:camera.viewfinder
              - action: package
                title: Package
                icon: sfsymbols:cube.box
              - action: be_there
                title: Will be there
                icon: sfsymbols:person.crop.circle.badge.checkmark
              image: /local/doorbell/{{camera_snapshot}}
              icon_url: /local/images/emoji/bell.png
        - action: notify.theaterofdreams
          data:
            message: ' '
            title: "Someone's at the front door \U0001F464"
            data:
              image: /local/doorbell/{{camera_snapshot}}
              tag: doorbell
          enabled: false
      - conditions:
        - condition: trigger
          id:
          - doorbell
        sequence:
        - alias: Ring chime on Friday
          action: tts.speak
          target:
            entity_id: tts.home_assistant_cloud
          data:
            media_player_entity_id: media_player.friday
            message: Ding dong. Someone is at the front door.
        - action: notify.all_phones
          metadata: {}
          data:
            message: "Doorbell \U0001F514"
            data:
              ttl: 0
              tag: bell
              entity_id: camera.doorbell
              notification_icon: mdi:doorbell-video
              activationMode: foreground
              car_ui: true
              channel: Doorbell
              push:
                interruption-level: time-sensitive
                category: camera
              actions:
              - action: URI
                title: Open
                uri: /lovelace/camera
                icon: sfsymbols:camera.viewfinder
              - action: package
                title: Package
                icon: sfsymbols:cube.box
              - action: be_there
                title: Will be there
                icon: sfsymbols:person.crop.circle.badge.checkmark
              image: /local/doorbell/{{camera_snapshot}}
              icon_url: /local/images/emoji/bell.png
        - alias: Wait 10 s
          delay:
            hours: 0
            minutes: 0
            seconds: 10
            milliseconds: 0
    - alias: Send Notification on Google TV Streamer if it is on.
      if:
      - condition: not
        conditions:
        - condition: state
          entity_id: media_player.google_tv_streamer
          state: 'off'
      then:
      - action: notify.google_tv_streamer
        data:
          message: Someone's at the front door
          title: ''
          data:
            duration: 4
            position: top-right
            fontsize: medium
            color: teal
            transparency: 50%
            image:
              path: /config/www/doorbell/{{camera_snapshot}}
    - alias: Send Discord silent notification
      action: rest_command.doorbell_discord
      data:
        image_url: https://8hzgwwt0ag8veor40ktvnmc9r9dhxpd3.ui.nabu.casa/local/doorbell/{{
          camera_snapshot }}
  - alias: Flash light.shapes if it is on
    if:
    - condition: state
      entity_id: light.shapes
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id: light.shapes
      data:
        flash: short
  - action: google_generative_ai_conversation.generate_content
    data:
      prompt: Very briefly describe what you see in this image from my doorbell camera.
        Your message needs to be short to fit in a phone notification. Don't describe
        buildings or cars.
      image_filename: /config/www/doorbell/{{camera_snapshot}}
    response_variable: generated_content
    enabled: false
  - alias: Wait 5 s
    delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  mode: single
- id: '1716218179726'
