- id: '1671638012875'
  alias: "\U0001F3F0Send notification if no motion in Den"
  description: ''
  triggers:
  - trigger: state
    entity_id: binary_sensor.den_motion_occupancy
    to: 'off'
    for: 00:04:00
    from: 'on'
  conditions:
  - condition: and
    conditions:
    - condition: time
      after: 09:00:00
      before: '21:00:00'
      enabled: false
    - condition: or
      conditions:
      - condition: state
        entity_id: switch.workstation
        state: 'on'
    - condition: state
      entity_id: binary_sensor.chair_occupancy
      state: 'off'
      enabled: true
      for:
        hours: 0
        minutes: 5
        seconds: 0
  actions:
  - action: notify.mobile_app_pixel8pro
    data:
      title: Are you there?
      message: 'No motion detected in Den in the last 5 minutes. '
      data:
        actions:
        - action: Den_OFF
          title: 'NO'
        notification_icon: mdi:motion-sensor-off
        tag: den_off
        icon_url: /local/images/notifications/ninja.png
  mode: single
- id: '1671638403506'
  alias: "\U0001F3F0Desk Presence Detection"
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.vibration_vibration
    to: 'on'
  conditions:
  - condition: and
    conditions:
    - condition: time
      after: 08:00:00
      before: '23:00:00'
      enabled: true
    - condition: state
      entity_id: switch.workstation
      state: 'off'
    - type: is_motion
      condition: device
      device_id: db5238f8a9cdf3587a27ebb327e3b72c
      entity_id: ae489ef14055e8adb0e0f817ebadaea4
      domain: binary_sensor
  actions:
  - alias: 'Choose by Den: ''off'' / ''on'''
    choose:
    - alias: 'If Den is ''off'': run Den as it was'
      conditions:
      - condition: state
        entity_id: input_boolean.den
        state: 'off'
      sequence:
      - action: automation.trigger
        target:
          entity_id: automation.den_as_it_was
        data: {}
    - alias: 'If Den is ''on'': turn on Workstation Socket'
      conditions:
      - condition: state
        entity_id: input_boolean.den
        state: 'on'
      sequence:
      - action: homeassistant.turn_on
        data: {}
        target:
          entity_id: switch.workstation
    default: []
  mode: single
