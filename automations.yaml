- id: '1655137751596'
  alias: ⚙️Tag Github with version when core updated
  description: ''
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - alias: Wait 1 min
    delay:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  - alias: Only continue if the running Core version is newer than the last GitHub
      tag
    condition: template
    value_template: '{{ version(states(''sensor.current_version'')) > states(''sensor.n00bcodr_homeassistant_latest_tag'')
      }}'
  - action: notify.mobile_app_pixel8pro
    data:
      message: Update tag in GitHub?
      title: Home Assistant Core Updated!
      data:
        tag: update
        notification_icon: mdi:git
        icon_url: /local/images/emoji/label.png
        color: red
        actions:
        - action: tag_update
          title: Update!
        - action: URI
          title: Open Repo
          uri: https://github.com/n00bcodr/homeassistant
  mode: single
- id: '1655814095516'
  alias: "\U0001F3ACCapture Shared URL - Google TV"
  description: Captures the URL shared and updates input_text ccgtv_share_url
  triggers:
  - trigger: event
    event_type: mobile_app.share
  conditions: []
  actions:
  - alias: 'Choose by app: Netflix / Amazon Prime / Hotstar / YouTube'
    choose:
    - alias: 'If the shared link is from Netflix: set value of ccgtv_share_url'
      conditions:
      - condition: template
        value_template: '{{ trigger.event.data|regex_search(''com.netflix'', ignorecase=TRUE)
          }}'
      sequence:
      - action: input_text.set_value
        data:
          value: '{{ trigger.event.data.text|regex_findall_index(find=''(http.*)'',
            ignorecase=TRUE) }}

            '
        target:
          entity_id: input_text.ccgtv_share_url
    - alias: 'If the shared link is from Amazon Prime: set value of ccgtv_share_url'
      conditions:
      - condition: template
        value_template: '{{ trigger.event.data|regex_search(''com.amazon'', ignorecase=TRUE)
          }}'
      sequence:
      - action: input_text.set_value
        data:
          value: '{{ trigger.event.data.text|regex_findall_index(find=''(http.*)'',
            ignorecase=true)|replace ("&ref_=atv_dp_share_seas&r=web", "") }}

            '
        target:
          entity_id: input_text.ccgtv_share_url
    - alias: 'If the shared link is from Hotstar: set value of ccgtv_share_url'
      conditions:
      - condition: template
        value_template: '{{ trigger.event.data|regex_search(''startv.hotstar'', ignorecase=TRUE)
          }}'
      sequence:
      - action: input_text.set_value
        data:
          value: '{{ trigger.event.data.text|regex_findall_index(find=''(http.*)'',
            ignorecase=TRUE) }}

            '
        target:
          entity_id: input_text.ccgtv_share_url
    - alias: 'If the shared link is from YouTube: set value of ccgtv_share_url'
      conditions:
      - condition: template
        value_template: '{{ trigger.event.data|regex_search(''youtu.be'', ignorecase=TRUE)
          }}'
      sequence:
      - action: input_text.set_value
        data:
          value: '{{ trigger.event.data.url|regex_findall_index(find=''(http.*)'',
            ignorecase=TRUE) }}

            '
        target:
          entity_id: input_text.ccgtv_share_url
    default:
    - action: notify.persistent_notification
      data:
        message: '{{ states(''input_text.ccgtv_share_url'') }}'
  - action: androidtv.adb_command
    data:
      command: HOME
    target:
      entity_id:
      - media_player.google_tv_streamer
  - action: script.load_share_url_googletv
    data: {}
  mode: single
- id: '1670537821206'
  alias: "\U0001F3F0Den off"
  description: Turns off all things in DEN when I exit.
  triggers:
  - trigger: tag
    tag_id: 5f5bedc8-6a15-486a-ab22-49ce237dde40
    enabled: true
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: Den_OFF
  - trigger: state
    entity_id:
    - input_boolean.den
    from: 'on'
    to: 'off'
  - trigger: device
    domain: mqtt
    device_id: 3fd72c6a517024c03b9531259c2d55d9
    type: action
    subtype: long
    discovery_id: 0x00124b001eaa8251 action_long
  - trigger: state
    entity_id:
    - person.pavanthanuj
    to:
    - Badminton
  - trigger: state
    entity_id:
    - person.pavanthanuj
    to:
    - Work
  conditions: []
  actions:
  - alias: 'Choose by Spotify source: not ''Pixel 8 Pro'' / ''Pixel 8 Pro'''
    choose:
    - alias: 'If Spotify source is not ''Pixel 8 Pro'': save scene → turn off Workstation
        Socket, Shapes +3 (+1 more)'
      conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: media_player.spotify
          attribute: source
          state: Pixel 8 Pro
      sequence:
      - action: scene.create
        data:
          scene_id: den_as_it_was
          snapshot_entities:
          - switch.workstation
          - light.light
          - media_player.spotify
          - light.shapes
          - climate.heater
      - action: homeassistant.turn_off
        data: {}
        target:
          entity_id:
          - switch.workstation
          - light.shapes
          - light.light
          - climate.heater
          - light.lamp
      - action: media_player.media_pause
        data: {}
        target:
          entity_id:
          - media_player.spotify
    - alias: 'If Spotify source is ''Pixel 8 Pro'': save scene → turn off Workstation
        Socket, Shapes +2'
      conditions:
      - condition: state
        entity_id: media_player.spotify
        attribute: source
        state: Pixel 8 Pro
      sequence:
      - action: scene.create
        data:
          scene_id: den_as_it_was
          snapshot_entities:
          - switch.workstation
          - light.light
          - light.shapes
      - action: homeassistant.turn_off
        data: {}
        target:
          entity_id:
          - switch.workstation
          - light.shapes
          - light.light
          - light.lamp
  mode: single
- id: '1670578939434'
  alias: "\U0001F3F0Den Button"
  description: ''
  triggers:
  - trigger: device
    domain: mqtt
    device_id: 3fd72c6a517024c03b9531259c2d55d9
    type: action
    subtype: single
    discovery_id: 0x00124b001eaa8251 action_single
    id: click
  - trigger: device
    domain: mqtt
    device_id: 3fd72c6a517024c03b9531259c2d55d9
    type: action
    subtype: double
    discovery_id: 0x00124b001eaa8251 action_double
    id: doubleclick
  conditions: []
  actions:
  - alias: 'Choose by button pressed: ''single'' / ''double'''
    choose:
    - alias: 'If button ''single'' is pressed: Choose by Den light: ''on'' / ''off'''
      conditions:
      - condition: trigger
        id: click
      sequence:
      - alias: 'Choose by Den light: ''on'' / ''off'''
        choose:
        - alias: 'If Den light is ''on'': turn off Den light'
          conditions:
          - condition: state
            entity_id: light.light
            state: 'on'
          sequence:
          - action: homeassistant.turn_off
            data: {}
            target:
              entity_id: light.light
        - alias: 'If Den light is ''off'': turn on Den light'
          conditions:
          - condition: state
            entity_id: light.light
            state: 'off'
          sequence:
          - action: light.turn_on
            data:
              color_temp_kelvin: 6500
              brightness_pct: 100
            target:
              entity_id: light.light
        default: []
    - alias: 'If button ''double'' is pressed: Choose by Den light: ''on'' / ''off'''
      conditions:
      - condition: trigger
        id: doubleclick
      sequence:
      - alias: 'Choose by Den light: ''on'' / ''off'''
        choose:
        - alias: 'If Den light is ''on'': turn off Den light'
          conditions:
          - condition: state
            entity_id: light.light
            state: 'on'
          sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: light.light
            data: {}
        - alias: 'If Den light is ''off'': turn on Den light'
          conditions:
          - condition: state
            entity_id: light.light
            state: 'off'
          sequence:
          - action: light.turn_on
            data:
              brightness_pct: 100
              color_temp_kelvin: 2000
            target:
              entity_id: light.light
        default: []
    default: []
  mode: single
- id: '1671637864679'
  alias: "\U0001F3F0Den as it was"
