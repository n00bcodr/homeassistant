- id: '1674758476057'
  alias: "\U0001F4A1Living Room Light Presence"
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_presence
    to: 'on'
    from: 'off'
    id: presence
  - trigger: state
    entity_id:
    - binary_sensor.living_room_presence
    to: 'off'
    from: 'on'
    id: clear
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: light.led_strip
      state: 'off'
      enabled: false
    - condition: state
      entity_id: media_player.google_tv_streamer_remote
      state: 'off'
    - condition: state
      entity_id: light.chandelier
      state: 'off'
  actions:
  - alias: 'Choose: Living Room Presence turns ''on'' and it is after sunset and…
      / Living Room Presence turns ''off'''
    choose:
    - alias: 'If Living Room Presence turns ''on'' and it is after sunset and before
        sunrise or Presence sensor light level below 40: turn on…'
      conditions:
      - condition: trigger
        id:
        - presence
      - condition: or
        conditions:
        - condition: sun
          before: sunrise
          after: sunset
        - condition: numeric_state
          entity_id: sensor.presence_sensor_light_level
          below: 40
      sequence:
      - action: light.turn_on
        data:
          brightness_pct: 100
        target:
          entity_id: light.living_room_lamp
    - alias: 'If Living Room Presence turns ''off'': turn off Living Room Lamp'
      conditions:
      - condition: trigger
        id:
        - clear
      sequence:
      - action: homeassistant.turn_off
        data: {}
        target:
          entity_id: light.living_room_lamp
  mode: queued
  max: 10
- id: '1675093554282'
