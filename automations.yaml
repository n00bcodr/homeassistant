  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.washing_machine_state
    from: Drying
    to: Cycle Complete
    id: dry
  - trigger: state
    entity_id:
    - sensor.washing_machine_state
    to: Cycle Complete
    not_from:
    - Drying
    - unavailable
    - unknown
    - Cycle Complete
    id: wash
  conditions: []
  actions:
  - alias: 'Choose by cycle: wash complete / dry complete'
    choose:
    - alias: "If Washing Machine State turns 'Cycle Complete': notify all phones '\U0001F9FA
        Wash Cycle Complete'"
      conditions:
      - condition: trigger
        id: wash
      sequence:
      - action: notify.all_phones
        data:
          message: at {{ as_timestamp(now()) | timestamp_custom('%-I:%M %p')}}
          data:
            notification_icon: mdi:washing-machine
            icon_url: /local/images/notifications/washing_machine.png
            sticky: 'true'
