    - alias: 'If Spotify is not ''playing'' or ''paused'': spotcast play dj'
      conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: media_player.spotify
          state:
          - playing
          - paused
      sequence:
      - action: spotcast.play_dj
        metadata: {}
        data:
          media_player:
            entity_id: media_player.{{ states('input_select.speakers_spotify') | lower
              | replace("'", "_") | replace(" ", "_") }}
  mode: single
