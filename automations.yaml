- id: '1684631799938'
  alias: "\U0001F3F0Bed Routine for curtains"
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.in_bed
    for:
      hours: 0
      minutes: 0
      seconds: 0
  conditions: []
  actions:
  - alias: 'Choose: In Bed is ''on'' and Curtains is ''open'' and time is 21:00-04:00
      / In Bed is ''off'' and Curtains is ''closed'' and time is…'
    choose:
    - alias: 'If In Bed is ''on'' and Curtains is ''open'' and time is 21:00-04:00:
        close Curtains'
      conditions:
      - condition: state
        entity_id: binary_sensor.in_bed
        state: 'on'
      - condition: state
        entity_id: cover.curtains
        state: open
      - condition: time
        after: '21:00:00'
        before: 04:00:00
      sequence:
      - action: cover.close_cover
        data: {}
        target:
          entity_id: cover.curtains
    - alias: 'If In Bed is ''off'' and Curtains is ''closed'' and time is 06:00-11:59:
        Wait until Toothbrush turns ''running'' (up to 10 min) → open…'
      conditions:
      - condition: state
        entity_id: binary_sensor.in_bed
        state: 'off'
      - condition: state
        entity_id: cover.curtains
        state: closed
      - condition: time
        after: 06:00:00
        before: '11:59:00'
      sequence:
      - alias: Wait until Toothbrush turns 'running' (up to 10 min)
        wait_for_trigger:
        - entity_id:
          - sensor.toothbrush
          to: running
          trigger: state
        timeout:
          hours: 0
          minutes: 10
          seconds: 0
          milliseconds: 0
        continue_on_timeout: false
      - action: cover.open_cover
        data: {}
        target:
          entity_id: cover.curtains
  mode: single
