- id: '1677184691191'
  alias: "\U0001F525Start/stop Timer when heating is turned on/off"
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - switch.heating
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: 'on'
    from: 'off'
    to: 'on'
  - trigger: state
    entity_id:
    - switch.heating
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: 'off'
    from: 'on'
    to: 'off'
  conditions: []
  actions:
  - alias: 'Choose by Heating: ''on'' / ''off'''
    choose:
    - alias: "If Heating turns 'on': start Heating timer → notify pixel8pro '\U0001F525
        Heating'"
      conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - action: timer.start
        data:
          duration:
            hours: 1
            minutes: 0
            seconds: 0
        target:
          entity_id: timer.heating
      - action: notify.mobile_app_pixel8pro
        data:
          message: "\U0001F525 Heating"
          data:
            chronometer: true
            when: '{{ ((as_timestamp(now()) + 5400 ) - as_timestamp(''1970-01-01T00:00:00Z''))
              | int }}'
            notification_icon: mdi:heating-coil
            image: /local/images/notifications/heating.png
            sticky: true
            persistant: true
            tag: heat
            actions:
            - action: URI
              title: Switch
              uri: entityId:switch.heating
            - action: switch.turn_off
              title: 'Off'
              entity_id: switch.heating
            icon_url: /local/images/emoji/fire.png
    - alias: 'If Heating turns ''off'': cancel Heating timer → notify pixel8pro ''clear_notification'''
      conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - action: timer.cancel
        data: {}
        target:
          entity_id: timer.heating
      - action: notify.mobile_app_pixel8pro
        data:
          message: clear_notification
          data:
            tag: heat
  mode: single
