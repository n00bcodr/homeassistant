- id: '1705166594977'
  alias: ⚙️ SpeedTest
  description: Runs SpeedTest every 3 hours
  triggers:
  - trigger: time_pattern
    hours: /3
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - alias: Wait 30 s
    delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - action: hassio.addon_start
    metadata: {}
    data:
      addon: 6b87c29e_speedtest_addon
  - alias: Wait 30 s
    delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - alias: 'Choose: Speedtest download below 100 and Internet speed below 4 / Internet
      speed above 3 and Speedtest download below 100'
    choose:
    - alias: 'If Speedtest download below 100 and Internet speed below 4: counter
        increment Internet speed → run Speedtest'
      conditions:
      - condition: and
        conditions:
        - condition: numeric_state
          entity_id: sensor.speedtest_download
          below: 100
        - condition: numeric_state
          entity_id: counter.internet_speed
          below: 4
      sequence:
      - action: counter.increment
        metadata: {}
        data: {}
        target:
          entity_id: counter.internet_speed
      - action: automation.trigger
        metadata: {}
        data:
          skip_condition: true
        target:
          entity_id: automation.speedtest
    - alias: 'If Internet speed above 3 and Speedtest download below 100: counter
        reset Internet speed → notify all phones android ''Internet…'
      conditions:
      - condition: and
        conditions:
        - condition: numeric_state
          entity_id: counter.internet_speed
          above: 3
        - condition: numeric_state
          entity_id: sensor.speedtest_download
          below: 100
      sequence:
      - action: counter.reset
        metadata: {}
        data: {}
        target:
          entity_id: counter.internet_speed
      - action: notify.all_phones_android
        metadata: {}
        data:
          message: "Speed is {{states.sensor.speedtest_download.state | round (1)}}
            Mbps \U0001F422"
          title: Internet is Wonky!
          data:
            notification_icon: mdi:wifi-alert
            tag: wifi_speed
            icon_url: /local/images/emoji/globe.png
  mode: restart
