    to: 'on'
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: BIN_OUT
  conditions: []
  actions:
  - alias: 'Choose: time is 18:00-02:00 and Blue bin next collection below 2 or… /
      the nearer bin pickup is within a day'
    choose:
    - alias: 'If time is 18:00-02:00 and Blue bin next collection below 2 or Black
        bin next collection below 2: turn on Bin → notify all…'
      conditions:
      - condition: and
        conditions:
        - condition: time
          after: '18:00:00'
          before: 02:00:00
        - condition: or
          conditions:
          - condition: numeric_state
            entity_id: sensor.blue_bin
            attribute: next_collection
            below: 2
          - condition: numeric_state
            entity_id: sensor.black_bin
            attribute: next_collection
            below: 2
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bin
        data: {}
      - action: notify.all_phones
        data:
          data:
            tag: bin_pickup
          message: clear_notification
      - alias: Set black_due, blue_due, bin_name, bin_color, bin_icon_url
        variables:
          black_due: '{{ state_attr(''sensor.black_bin'',''next_collection'') is not
            none and state_attr(''sensor.black_bin'',''next_collection'') <= 1 }}'
          blue_due: '{{ state_attr(''sensor.blue_bin'',''next_collection'') is not
            none and state_attr(''sensor.blue_bin'',''next_collection'') <= 1 }}'
          bin_name: '{{ ''Black Bin'' if black_due else (''Blue Bin'' if blue_due
            else ''Bin'') }}'
          bin_color: '{{ ''black'' if black_due else (''blue'' if blue_due else ''green'')
            }}'
          bin_icon_url: '{{ ''/local/images/bins/black_bin.png'' if black_due else
            (''/local/images/bins/blue_bin.png'' if blue_due else '''') }}'
      - action: notify.all_phones
        data:
          data:
            notification_icon: mdi:trash-can-outline
            color: '{{ bin_color }}'
            timeout: 600
            activationMode: foreground
            icon_url: '{{ bin_icon_url }}'
          message: ' '
          title: '{{ bin_name }} is outside.'
    - alias: 'If the nearer bin pickup is within a day: turn off Bin'
      conditions:
      - condition: template
        value_template: "{% set black_next_collection = state_attr('sensor.black_bin',\n'next_collection')
          %} {% set blue_next_collection =\nstate_attr('sensor.blue_bin', 'next_collection')
          %}\n\n{% if black_next_collection < blue_next_collection %}\n  {{(state_attr(\"sensor.black_bin\",
          \"next_collection\")) >= 2 }}\n{% else %}\n  {{(state_attr(\"sensor.blue_bin\",
          \"next_collection\")) >= 2 }}\n{% endif %}\n"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bin
        data: {}
  mode: single
