      - action: notify.all_phones
        data:
          data:
            notification_icon: mdi:trash-can
            icon_url: /local/images/bins/blue_bin.png
            tag: bin_pickup
            color: blue
          message: Pickup is tomorrow, {{ states.sensor.blue_bin.state}}
          title: Blue Bin
      alias: Blue Bin Collection is tomorrow and it is 11 AM
    - conditions:
      - alias: Blue Bin Next Collection is in 1 Day
        condition: state
        entity_id: sensor.blue_bin
        attribute: next_collection
        state: 1
      sequence:
      - alias: 'Repeat until Bin is ''on'': Clear any existing notifications (+2 more)'
        repeat:
