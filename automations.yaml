- id: '1720523835406'
  alias: "\U0001F50BBattery Notes - Battery Threshold"
  description: ''
  triggers:
  - trigger: event
    event_type: battery_notes_battery_threshold
    event_data:
      battery_low: true
    id: low
    alias: Battery went low
  - trigger: event
    event_type: battery_notes_battery_threshold
    event_data:
      battery_low: false
    id: high
    alias: Battery went high
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.device_id not in excluded_devices}}'
  actions:
  - alias: 'Choose by battery state: low / high'
    choose:
    - alias: 'If event battery_notes_battery_threshold: If a low-battery notification
        is due: save scene → notify pixel8pro → Run user on low…'
      conditions:
      - condition: trigger
        id:
        - low
      sequence:
      - alias: 'If a low-battery notification is due: save scene → notify pixel8pro'
        if:
        - condition: template
          value_template: '{{ low_notification }}'
        then:
        - action: persistent_notification.create
          data:
            title: '{{ trigger.event.data.device_name }} Battery Low

              '
            notification_id: battery_notes_threshold {{ trigger.event.data.device_id
              }}-{{ trigger.event.data.source_entity_id }}
            message: 'The device has a battery level of {{ trigger.event.data.battery_level
              }}% {{ ''\n'' -}} You need {{ trigger.event.data.battery_quantity }}×
              {{ trigger.event.data.battery_type }}

              '
          enabled: false
        - action: notify.mobile_app_pixel8pro
          data:
            title: '{{ trigger.event.data.device_name }} Battery Low

              '
            message: 'The device has a battery level of {{ trigger.event.data.battery_level
              }}% {{ ''\n'' -}} You need {{ trigger.event.data.battery_quantity }}×
              {{ trigger.event.data.battery_type }}

              '
            data:
              tag: battery
              notification_icon: mdi:battery-alert
              color: red
              icon_url: /local/images/emoji/low_battery.png
      - alias: Run user on low actions
        choose: []
        default: []
    - alias: 'If event battery_notes_battery_threshold: If a low-battery notification
        is due: persistent_notification dismiss → Run user on…'
      conditions:
      - condition: trigger
        id:
        - high
      sequence:
      - alias: 'If a low-battery notification is due: persistent_notification dismiss'
        if:
        - condition: template
          value_template: '{{ low_notification }}'
        then:
        - action: persistent_notification.dismiss
          data:
            notification_id: battery_notes_threshold {{ trigger.event.data.device_id
              }}-{{ trigger.event.data.source_entity_id }}
      - alias: Run user on high actions
        choose: []
        default: []
  variables:
    low_notification: true
    high_notification: true
    excluded_devices:
    - null
  mode: queued
