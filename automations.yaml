            data:
              data:
                tag: bin_pickup
              message: clear_notification
            alias: Clear any existing notifications
          - action: notify.all_phones
            data:
              data:
                notification_icon: mdi:trash-can
                color: blue
                icon_url: /local/images/bins/blue_bin.png
                tag: bin_pickup
                actions:
                - action: BIN_OUT
                  title: Yeah, the bin is out!
              message: Put the Blue Bin out.
