- id: '1765110819002'
  alias: F1 Track Light
  description: Shows F1 track status on light.shapes only during Qualifying and Race
    sessions; restores the light's prior state once the session truly ends (instead
    of forcing it off)
  triggers:
  - trigger: state
    entity_id: sensor.f1_session_f1_session_status
    id: session_status
  - trigger: state
    entity_id: sensor.f1_session_f1_track_status
    id: track_status
  conditions:
  - condition: state
    entity_id: sensor.f1_session_f1_current_session
    attribute: type
    state:
    - Qualifying
    - Race
  actions:
  - alias: 'Choose: F1 session status changes and the F1… / F1 session status is ''pre''
      or ''live'' / F1 session status is ''finished'' or…'
    choose:
    - alias: Snapshot light state at session start
      conditions:
      - condition: trigger
        id: session_status
      - condition: template
        value_template: '{{ (trigger.from_state.state if trigger.from_state else '''')
          not in [''pre'', ''live''] and trigger.to_state.state in [''pre'', ''live'']
          }}'
      sequence:
      - action: scene.create
        data:
          scene_id: f1_track_light_previous
          snapshot_entities:
          - light.shapes
    - alias: Show track status colour while session is active
      conditions:
      - condition: state
        entity_id: sensor.f1_session_f1_session_status
        state:
        - pre
        - live
      sequence:
      - alias: 'Choose by F1 track status: ''CLEAR'' / ''YELLOW'' / ''VSC'' or F1
          track… / ''RED'''
        choose:
        - alias: 'If F1 track status is ''CLEAR'': turn on Shapes'
          conditions:
          - condition: state
            entity_id: sensor.f1_session_f1_track_status
            state:
            - CLEAR
          sequence:
          - action: light.turn_on
            data:
              color_name: limegreen
            target:
              entity_id:
              - light.shapes
        - alias: 'If F1 track status is ''YELLOW'': turn on Shapes'
          conditions:
          - condition: state
            entity_id: sensor.f1_session_f1_track_status
            state:
            - YELLOW
          sequence:
          - action: light.turn_on
            data:
              color_name: yellow
            target:
              entity_id:
              - light.shapes
        - alias: 'If F1 track status is ''VSC'' or F1 track status is ''SC'': turn
            on Shapes'
          conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: sensor.f1_session_f1_track_status
              state:
              - VSC
            - condition: state
              entity_id: sensor.f1_session_f1_track_status
              state:
              - SC
          sequence:
          - action: light.turn_on
            data:
              flash: short
              effect: Safety Car
            target:
              entity_id:
              - light.shapes
        - alias: 'If F1 track status is ''RED'': turn on Shapes'
          conditions:
          - condition: state
            entity_id: sensor.f1_session_f1_track_status
            state:
            - RED
          sequence:
          - action: light.turn_on
            data:
              color_name: red
            target:
              entity_id:
              - light.shapes
    - alias: Restore previous light state once session has truly ended
      conditions:
      - condition: state
        entity_id: sensor.f1_session_f1_session_status
        state:
        - finished
        - finalised
        - ended
      sequence:
      - action: scene.turn_on
        continue_on_error: true
        target:
          entity_id: scene.f1_track_light_previous
  mode: restart
