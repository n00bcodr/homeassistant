default_config:

homeassistant:
  packages: !include_dir_named packages/
  allowlist_external_dirs:
    - /config/.storage
    - /config/
    - /media/
  whitelist_external_dirs:
    - "/share"

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - !secret trusted_ip1
    - !secret trusted_ip2
    - 192.168.168.168
    - 100.100.11.11
    - 127.0.0.1
    - ::1    

logger:
  default: critical
  logs:
  #  custom_components.localtuya: debug
   custom_components.jellyfin: debug
   homeassistant.components.http: warning
  #  homeassistant.components.androidtv: debug

delete:
my:
battery_notes:
automation: !include automations.yaml
command_line: !include command_line.yaml
conversation: !include conversation.yaml
group: !include groups.yaml
homekit: !include homekit.yaml
intent_script: !include intent_script.yaml
notify: !include notify.yaml
rest_command: !include rest_commands.yaml
scene: !include scenes.yaml
script: !include scripts.yaml
shell_command: !include shell_command.yaml
sensor: !include sensor.yaml
template: !include template.yaml
media_player: !include mediaplayer.yaml
tts:
  - platform: google_translate

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/custom-sidebar/custom-sidebar-plugin.js

#mariadb config
recorder:
  db_url: !secret recorder_db_url
  purge_keep_days: 15
  exclude:
    domains:
      - update
    entity_globs:
      - sensor.sun*
      - sensor.moon*
      - weather.*
      - sensor.x60*
      - sensor.doorbell*
      - sensor.count*
      - sensor.f1_*
      - sensor.docker*
      - switch.docker*
      - button.docker*w
      - device_tracker.smart*
    entities:
      - sun.sun
      - sensor.f1_season_results

spotcast:
  sp_dc: !secret sp_dc
  sp_key: !secret sp_key
