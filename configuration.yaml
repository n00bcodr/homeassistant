default_config:

homeassistant:
  packages: !include_dir_named packages/
  allowlist_external_dirs:
    - /config/.storage
    - /config/
    - /media/
  whitelist_external_dirs:
    - "/share"


logger:
  default: warning
  logs:
   homeassistant.components.http: warning
  #  custom_components.homewhiz: info
  #  habluetooth: info
  #  custom_components.localtuya: debug
  #  custom_components.jellyfin: debug
  #  homeassistant.components.androidtv: debug

delete:
my:
automation: !include automations.yaml
command_line: !include command_line.yaml
conversation: !include conversation.yaml
group: !include groups.yaml
homekit: !include homekit.yaml
intent_script: !include intent_script.yaml
notify: !include notify.yaml
rest_command: !include rest_commands.yaml
scene: !include scenes.yaml
script: !include scripts.yaml
shell_command: !include shell_command.yaml
template: !include template.yaml
tts:
  - platform: google_translate

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/custom-sidebar/custom-sidebar-plugin.js
    - /local/community/lovelace-card-mod/card-mod.js?v=190927524421

#mariadb config
recorder:
  db_url: !secret recorder_db_url
  purge_keep_days: 15
  exclude:
    domains:
      - update
    entity_globs:
      - sensor.sun*
      - sensor.moon*
      - weather.*
      - sensor.x60*
      - sensor.doorbell*
      - sensor.count*
      - sensor.f1_*
      - sensor.docker*
      - switch.docker*
      - button.docker*
      - device_tracker.smart*
      - sensor.jellyha_*
      - media_player.jellyha_*
      - sensor.*_last_seen
    entities:
      - sun.sun
      - sensor.f1_season_results
      - sensor.time
      - sensor.canada_time
      - sensor.san_francisco_time
      - sensor.india_time
